<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capri 1535 — Fondale Example</title>
    <link rel="icon" href="data:," />
    <style>
      html, body, #game { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #15101d; }
      #restore {
        position: fixed; z-index: 2; top: 8px; right: 8px; padding: 6px 8px;
        color: white; background: #211b2d; border: 2px solid white; font: 12px monospace;
      }
      #restore:focus-visible { outline: 3px double #f4cf63; outline-offset: 2px; }
      #error { position: fixed; inset: 20% 10%; color: white; font: 16px monospace; }
      #error:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="restore" type="button">Save and restore</button>
    <output id="error"></output>
    <script type="module" src="/examples/capri-1535/src/main.ts"></script>
  </body>
</html>
