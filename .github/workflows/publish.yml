name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Refuse a tag that disagrees with package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $declared." >&2
            exit 1
          fi

      - run: npx playwright install --with-deps chrome

      - run: npm run build

      - run: npm run verify

      - name: Refuse a dialogue server that disagrees with the core
        run: |
          core="$(node -p 'require("./package.json").version')"
          peer="$(node -p 'require("./packages/dialogue-server/package.json").peerDependencies["fondale"]')"
          if [ "$peer" != "$core" ]; then
            echo "dialogue-server expects core $peer but this tag publishes $core." >&2
            exit 1
          fi

      - name: Publish the core
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish the dialogue server
        run: npm publish --provenance --workspace @fondale/dialogue-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
