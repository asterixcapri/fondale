name: Publish

on:
  push:
    tags:
      - "v*"
      - "dialogue-server-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Read the tag
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            dialogue-server-v*)
              echo "workspace=@fondale/dialogue-server" >> "$GITHUB_OUTPUT"
              echo "manifest=packages/dialogue-server/package.json" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#dialogue-server-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "workspace=" >> "$GITHUB_OUTPUT"
              echo "manifest=package.json" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Node 22 ships npm 10, which cannot authenticate to the registry over
      # OIDC. Trusted publishing — which is how this workflow publishes, hence
      # `id-token: write` and `--provenance` — wants npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Refuse a tag that disagrees with its package
        run: |
          declared="$(node -p 'require("./${{ steps.target.outputs.manifest }}").version')"
          if [ "${{ steps.target.outputs.version }}" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match ${{ steps.target.outputs.manifest }} $declared." >&2
            exit 1
          fi

      - run: npx playwright install --with-deps chrome

      # `npm run build` exercises the Runtime Asset normaliser, which shells out
      # to `magick`. Ubuntu ships ImageMagick 6, which has no such command, so
      # the upstream 7 AppImage is put on the PATH behind a shim. The shim sets
      # APPIMAGE_EXTRACT_AND_RUN because the runners have no FUSE.
      - name: Install ImageMagick 7
        env:
          IMAGEMAGICK_VERSION: 7.1.2-29
        run: |
          url="https://github.com/ImageMagick/ImageMagick/releases/download/$IMAGEMAGICK_VERSION/ImageMagick-$IMAGEMAGICK_VERSION-gcc-x86_64.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/magick.AppImage" "$url"
          chmod +x "$RUNNER_TEMP/magick.AppImage"
          printf '#!/bin/sh\nexport APPIMAGE_EXTRACT_AND_RUN=1\nexec "%s" "$@"\n' \
            "$RUNNER_TEMP/magick.AppImage" | sudo tee /usr/local/bin/magick > /dev/null
          sudo chmod +x /usr/local/bin/magick
          magick -version

      - run: npm run build

      - run: npm run verify

      - name: Publish
        run: |
          if [ -n "${{ steps.target.outputs.workspace }}" ]; then
            npm publish --provenance --workspace "${{ steps.target.outputs.workspace }}"
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
