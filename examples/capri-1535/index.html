<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capri 1535 — Fondale Example</title>
    <link rel="icon" href="data:," />
    <style>
      html, body, #game { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #15101d; }
      #reflection {
        position: fixed;
        z-index: 2;
        top: 8px;
        right: 8px;
        padding: 6px 8px;
        color: white;
        background: #211b2d;
        border: 2px solid white;
        font: 12px monospace;
      }
      #reflection { left: 8px; right: auto; }
      #error { position: fixed; inset: 20% 10%; color: white; font: 16px monospace; }
      #error:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="reflection" type="button">Rifletti</button>
    <output id="error"></output>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
