services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fondale
      POSTGRES_PASSWORD: fondale
      POSTGRES_DB: fondale_dialogue
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fondale -d fondale_dialogue"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - dialogue-adapter-postgres:/var/lib/postgresql/data

volumes:
  dialogue-adapter-postgres:
